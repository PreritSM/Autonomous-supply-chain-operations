# dbt project for the agentic supply-chain pipeline (Build Spec §6, §14).
# Four layers, no sprawl: staging → intermediate → marts → bi.
name: "supply_pipeline"
version: "1.0.0"
config-version: 2

profile: "supply_pipeline"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  supply_pipeline:
    staging:
      +materialized: view       # 1:1 typed views over raw tables
    intermediate:
      +materialized: view
    marts:
      +materialized: table      # fct_daily_demand — read by the forecasting agent
    bi:
      +materialized: table      # denormalized for Power BI import mode (§14.1)
      +schema: bi
