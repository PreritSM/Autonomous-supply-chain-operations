# dbt connection profile. Values come from the environment (.env.example) so no
# secrets are committed. Points at the docker-compose Postgres warehouse.
supply_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'pipeline') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'pipeline') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'supply_pipeline') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 4
